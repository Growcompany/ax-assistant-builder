[project]
name = "axbuilder"
version = "0.1.0"
description = "AX Assistant Builder: 회사 문서로 그 회사 전용 RAG 어시스턴트를 만드는 플랫폼"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "kiwipiepy",
    "pdfplumber",
    "PyYAML",
    "qdrant-client",
    "anthropic",
    "httpx",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# torch(CUDA)를 끌어오므로 CI·단위 테스트에서는 설치하지 않는다
ml = [
    "sentence-transformers",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ 안의 코드 블록은 실행 코드가 아닌 명세라서 린트·포맷 대상에서 제외
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs models or network"]
addopts = "-m 'not slow'"
