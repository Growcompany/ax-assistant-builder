[project]
name = "axbuilder"
version = "0.3.0"
description = "AX Assistant Builder: 회사 문서로 그 회사 전용 RAG 어시스턴트를 만드는 플랫폼"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    # 불용어·테스트의 토큰 수가 Kiwi 분석 결과에 의존한다. 올릴 때는 테스트로 확인
    "kiwipiepy>=0.24,<0.25",
    "pdfplumber",
    "PyYAML",
    "qdrant-client",
    # fallbacks="default"(서버측 폴백)·stop_details·httpx2 기반 클라이언트를 쓴다. 2.6.0에서 확인
    "anthropic>=2.6",
    "httpx",
    "fastapi",
    "uvicorn",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# torch(CUDA)를 끌어오므로 CI·단위 테스트에서는 설치하지 않는다
ml = [
    "sentence-transformers",
]
# MCP 서버(axb mcp)용. 기본 설치와 단위 테스트는 이것 없이 돈다
mcp = [
    "mcp>=2",
]

[project.scripts]
axb = "axbuilder.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 화면 파일(HTML·CSS·JS)을 설치본에도 넣는다
[tool.setuptools.package-data]
"axbuilder.api" = ["static/**"]

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ 안의 코드 블록은 실행 코드가 아닌 명세라서 린트·포맷 대상에서 제외
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs models or network"]
addopts = "-m 'not slow'"
