# 가상 은행(bank) 워크스페이스 코퍼스 출처 목록 (13개 문서)
#
# 원문은 이 저장소에 커밋하지 않는다. scripts/download_corpus.py가 url에서 받아
# data/workspaces/bank/raw/에 저장하고(git 제외 경로), raw/manifest.json에 sha256과 받은 시각을 남긴다.
# 이유 (근거: docs/research/12-example-data-sources.md):
#   - 법령·고시: 저작권법 제7조 제1·2호로 보호받지 않는 저작물이지만, 개정본을 그때그때 받도록 스크립트를 기본으로 한다.
#   - 공정위 표준약관: 게시물에 공공누리 표시가 없고 공정위 저작권정책상 사전 협의 대상이라 권리 관계가 불명확하다.
#   - 실제 은행 상품설명서: 은행의 업무상저작물(저작권법 제9조)이라 쓰지 않고, 가상 설명서를 직접 썼다.
# 저장소에 있는 파일은 직접 쓴 가상 문서 6개(corpus/bank/synthetic, corpus/bank/internal)뿐이다.
#
# 항목 = DocMeta 필드(doc_id, title, source, doc_type, access_level, effective_from, effective_to)
#        + url(받는 문서) 또는 path(저장소 파일) 중 하나 + format + license
# URL 확인일: 2026-11-09, GET 요청으로 확인(law.go.kr은 HEAD 요청에 404를 돌려준다).
# 법령이 개정되면 lsiSeq가 바뀐다. 현행본은 https://www.law.go.kr/법령/<법령명> 페이지의 iframe src에서 다시 찾는다.
# 출처 표기(법령·고시): 국가법령정보센터(법제처)

